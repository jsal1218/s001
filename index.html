<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>S001 — your personal dashboard</title>
<meta name="description" content="S001: a fast, installable personal dashboard with live basketball scores and quick single-player games.">
<meta name="theme-color" content="#D62828"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="S001">

<style>
.hero{position:relative;overflow:hidden;color:#f6f4ee;padding:calc(18px + env(safe-area-inset-top)) 20px 30px;border-radius:0 0 28px 28px;background:#0a3a2a;isolation:isolate}
.hero svg.mesh{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .top{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto}.hero .top img{border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.02em;margin-right:auto}.brand small{display:block;font-weight:500;font-size:.72rem;opacity:.8;letter-spacing:.02em}
.hero .iconbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#f6f4ee;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .copy{max-width:1040px;margin:22px auto 0}.hero h1{font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(135deg,#fbe9a6,#d9b44a 55%,#b8901f);-webkit-background-clip:text;background-clip:text;color:transparent}
#today{opacity:.85;margin:6px 0 14px;font-size:.92rem;min-height:1.4em}
#chips{display:flex;gap:8px;flex-wrap:wrap;min-height:32px}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip.hot{background:linear-gradient(135deg,#fbe9a6,#d9b44a 55%,#b8901f);color:#2a1f00;border-color:transparent}
main{margin-top:-18px;position:relative;min-height:100vh}
.sect{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 4px 10px;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow);min-height:180px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text);text-align:center;padding:16px 10px 14px;border-radius:18px;min-height:44px;background:var(--card);border:1px solid var(--line);transition:border-color .15s}.app:hover{border-color:var(--acc)}
.an b{display:block;font-size:.98rem;letter-spacing:-.01em}.an small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3;margin-top:2px}.app img{width:68px;height:68px;border-radius:19px;box-shadow:0 4px 12px rgba(10,58,42,.22)}.app:hover img{transform:translateY(-2px)}
#widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.wcard::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--gold-grad)}
.wcard>header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}.wcard>header img{border-radius:8px}.wcard h2{margin:0;font-size:1rem;margin-right:auto}
.more{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:.85rem;text-decoration:none;min-height:44px;padding:0 4px}
.widget{padding:4px 16px 16px}#w-nba{min-height:118px}#w-games{min-height:206px}
.ticker{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -4px;scrollbar-width:none}.ticker::-webkit-scrollbar{display:none}
.tk{scroll-snap-align:start;flex:none;min-width:132px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.tk.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.tk-t{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:.9rem}.tk-t img{object-fit:contain}
.tk-s{font-weight:800;font-size:1rem}.tk-at{font-style:normal;font-weight:600;color:var(--muted);margin-right:4px;font-size:.8em}.tk-s.w{color:var(--gold-text)}.tk .pill{align-self:flex-start;margin-top:2px}
.glist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.glab{margin:0 0 2px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.glist li{border-top:1px solid var(--line);min-width:0}.glist li a{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:58px;min-width:0;text-decoration:none;color:var(--text)}.glist li a:hover b{color:var(--acc)}.glist li:nth-child(-n+2){border:0}.gcta{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px;min-height:44px;border-radius:14px;background:var(--acc);color:var(--on-acc);font-weight:700;text-decoration:none}.gcta:hover{background:var(--acc-h)}
.glist img{border-radius:11px}.gn{flex:1;min-width:0}.gn b{display:block;font-size:.88rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gn small{font-size:.74rem}.gn small{color:var(--gold-text);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.gplay{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acc);color:var(--on-acc)}
@media (prefers-reduced-motion:no-preference){.app img{transition:transform .2s}.hero .orb{animation:drift 18s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(30px,-20px) scale(1.08)}}}
</style></head>

<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#fbe9a6" stop-opacity="0"/><stop offset=".5" stop-color="#fbe9a6" stop-opacity=".35"/><stop offset="1" stop-color="#fbe9a6" stop-opacity="0"/></linearGradient></defs>
